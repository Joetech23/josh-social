<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../../../../"><meta name="es-size" content="1080x1920"><link rel="stylesheet" href="design/templates/shared.css"><link rel="stylesheet" href="design/icons/icons.css"><style>body{margin:0}.f{width:1080px;height:1920px;position:relative;overflow:hidden}</style><title>EV05 A or B</title><link rel="stylesheet" href="design/templates/glass.css"><style>
.f{background:linear-gradient(160deg,#0A2A9E 0%,#1440C8 40%,#1D5BE8 75%,#3B82F6 100%);color:#fff;font-family:var(--font-body)}

</style></head><body><div class="f">
